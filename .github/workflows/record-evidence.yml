name: Record evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        bundle:
          - name: agent-handoff-evidence
            module: k2do.labs.handoff_evidence_recorder
          - name: deepthink-trace-evidence
            module: k2do.labs.trace_evidence_recorder

    name: ${{ matrix.bundle.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out clean source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install capture dependencies outside the source tree
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-evidence.txt
          ".[dev]"

      - name: Assert a clean capture source
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record exactly one source-bound bundle
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m ${{ matrix.bundle.module }} record

      - name: Verify the fresh bundle
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m ${{ matrix.bundle.module }} check

      - name: Upload the verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.bundle.name }}-${{ github.sha }}
          path: docs/${{ matrix.bundle.name }}
          if-no-files-found: error
          retention-days: 1
