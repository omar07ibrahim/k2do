name: Verify reproducible evidence

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild both evidence bundles for independent review
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - feat/provenance-and-safety
    paths:
      - .github/workflows/record-evidence.yml
      - pyproject.toml
      - requirements-evidence.txt
      - requirements-ci-py312.lock
      - requirements-ci-py312.provenance.json
      - k2do/**
      - docs/agent-handoff-evidence/**
      - docs/deepthink-trace-evidence/**

permissions:
  contents: read

concurrency:
  group: verify-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        bundle:
          - name: agent-handoff-evidence
            module: k2do.labs.handoff_evidence_recorder
          - name: deepthink-trace-evidence
            module: k2do.labs.trace_evidence_recorder

    name: ${{ matrix.bundle.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the immutable event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up the canonical Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-ci-py312.lock

      - name: Assert the clean capture source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "omar07ibrahim/k2do"
          test "$GITHUB_EVENT_NAME" = "push" ||
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${K2_API_KEY:-}"
          test "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" = ""

      - name: Install only the hash-locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --requirement requirements-ci-py312.lock
          test "$(python -m pip --version | awk '{print $2}')" = "26.1.2"
          python -m pip install \
            --no-build-isolation \
            --no-deps \
            --editable .
          python -m pip check

      - name: Reproduce a missing bundle or verify the committed bundle
        env:
          REFRESH_BUNDLE: ${{ inputs.refresh && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REFRESH_BUNDLE" = "true" ]; then
            candidate="$RUNNER_TEMP/evidence-refresh-${{ matrix.bundle.name }}"
            git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$candidate"
            rm -rf -- \
              "$candidate/docs/agent-handoff-evidence" \
              "$candidate/docs/deepthink-trace-evidence"
            git -C "$candidate" add -A -- docs
            source_date="$(git -C "$candidate" show -s --format=%aI HEAD)"
            GIT_AUTHOR_NAME='Omar Ibrahim' \
              GIT_AUTHOR_EMAIL='31526072+omar07ibrahim@users.noreply.github.com' \
              GIT_AUTHOR_DATE="$source_date" \
              GIT_COMMITTER_NAME='Omar Ibrahim' \
              GIT_COMMITTER_EMAIL='31526072+omar07ibrahim@users.noreply.github.com' \
              GIT_COMMITTER_DATE="$source_date" \
              git -C "$candidate" commit --quiet --message 'Prepare reproducible evidence refresh'
            (
              cd "$candidate"
              PYTHONPATH="$candidate" python -m ${{ matrix.bundle.module }} record
              PYTHONPATH="$candidate" python -m ${{ matrix.bundle.module }} check
            )
            rm -rf -- "docs/${{ matrix.bundle.name }}"
            cp -a -- "$candidate/docs/${{ matrix.bundle.name }}" "docs/${{ matrix.bundle.name }}"
            python -m ${{ matrix.bundle.module }} check
          elif git cat-file -e "$GITHUB_SHA:docs/${{ matrix.bundle.name }}" 2>/dev/null; then
            python -m ${{ matrix.bundle.module }} check
          else
            python -m ${{ matrix.bundle.module }} record
            python -m ${{ matrix.bundle.module }} check
          fi

      - name: Enforce the evidence mutation boundary
        env:
          REFRESH_BUNDLE: ${{ inputs.refresh && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4-)"
          if [ "$REFRESH_BUNDLE" = "true" ] ||
            ! git cat-file -e "$GITHUB_SHA:docs/${{ matrix.bundle.name }}" 2>/dev/null
          then
            test -n "$changed"
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^docs/${{ matrix.bundle.name }}/' || true)"
            test -z "$unexpected"
          else
            test -z "$changed"
          fi
          test -z "$(find docs/${{ matrix.bundle.name }} -type l -print -quit)"

      - name: Emit the bounded refresh manifest
        if: ${{ inputs.refresh }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="docs/${{ matrix.bundle.name }}/manifest.json"
          test -f "$manifest"
          test "$(wc -c < "$manifest")" -le 262144
          printf 'K2DO_MANIFEST_BEGIN %s\n' "${{ matrix.bundle.name }}"
          base64 --wrap=0 "$manifest"
          printf '\nK2DO_MANIFEST_END %s\n' "${{ matrix.bundle.name }}"

      - name: Upload the verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.bundle.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/${{ matrix.bundle.name }}/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
