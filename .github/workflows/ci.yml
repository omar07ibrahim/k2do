name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-evidence.txt
          -e ".[dev]"

      - name: Run the complete offline suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q

      - name: Lint the hardened lifecycle boundary
        run: >-
          ruff check --no-cache
          k2do/agent/context.py
          k2do/agent/loop.py
          k2do/agent/router.py
          k2do/agent/subagent.py
          k2do/channels/manager.py
          k2do/channels/telegram.py
          k2do/cli/commands.py
          k2do/cron/service.py
          k2do/heartbeat/service.py
          k2do/labs/mcp_fault_lab.py
          k2do/labs/strict_mcp_stdio_server.py
          tests/test_agent_close.py
          tests/test_cli_security.py
          tests/test_mcp_explicit_isolation.py
          tests/test_mcp_fault_lab.py
          tests/test_mcp_lifecycle.py
          tests/test_mcp_trust_boundary.py
          tests/test_router_preferences.py
          tests/test_service_shutdown.py
          tests/test_strict_mcp_stdio_server.py
          tests/test_subagent_shutdown.py
          --ignore E501,W293,I001,ASYNC109,ASYNC110,ASYNC210,ASYNC230,ASYNC240,ASYNC250,ASYNC251
