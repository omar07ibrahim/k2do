<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">MCP fault laboratory architecture</title><desc id="desc">Architecture derived from a verified receipt with 6 scenarios and 10 reaped subprocesses.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7ee787"/></marker></defs><rect width="1440" height="650" rx="24" fill="#0d1117"/><text x="70" y="78" fill="#f0f6fc" font-size="38" font-weight="700">Real subprocesses. Production lifecycle. Safe public receipt.</text><text x="70" y="125" fill="#8b949e" font-size="20">10 process generations · 10 reaped · stdio NDJSON · private authenticated AF_UNIX audit</text><path d="M 350 295 H 400" stroke="#7ee787" stroke-width="4" marker-end="url(#arrow)"/><path d="M 690 295 H 740" stroke="#7ee787" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1030 295 H 1080" stroke="#7ee787" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="220" width="280" height="150" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="210" y="270" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">Fault scenarios</text><text x="210" y="310" text-anchor="middle" fill="#8b949e" font-size="15">6 deterministic cases</text><rect x="410" y="220" width="280" height="150" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="550" y="270" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">AgentLoop lifecycle</text><text x="550" y="310" text-anchor="middle" fill="#8b949e" font-size="15">production mcp_lifespan / close_mcp</text><rect x="750" y="220" width="280" height="150" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="890" y="270" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">Pinned MCP SDK</text><text x="890" y="310" text-anchor="middle" fill="#8b949e" font-size="15">mcp-python-sdk-2.0.0</text><rect x="1090" y="220" width="280" height="150" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="1230" y="270" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">Strict stdio fixtures</text><text x="1230" y="310" text-anchor="middle" fill="#8b949e" font-size="15">10 fresh generations</text><rect x="310" y="470" width="820" height="90" rx="18" fill="#12261e" stroke="#238636"/><text x="720" y="510" text-anchor="middle" fill="#7ee787" font-size="22" font-weight="700">Public boundary: labels, counts, booleans, SHA-256 only</text><text x="720" y="540" text-anchor="middle" fill="#8b949e" font-size="16">No token, PID, request ID, raw error, path, argument, or timing leaves the lab</text></svg>
