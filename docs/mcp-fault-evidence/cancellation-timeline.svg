<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc"><title id="title">MCP cancellation and recovery timeline</title><desc id="desc">Observed sequence summarized from six real lifecycle scenarios.</desc><rect width="1600" height="560" rx="24" fill="#0d1117"/><text x="55" y="68" fill="#f0f6fc" font-size="36" font-weight="700">Cancellation is a lifecycle, not an exception branch</text><text x="55" y="110" fill="#8b949e" font-size="18">Every transition below is asserted against a real stdio subprocess.</text><path d="M 120 285 H 1395" stroke="#58a6ff" stroke-width="6"/><circle cx="120" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="120" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">discover</text><text x="120" y="345" text-anchor="middle" fill="#8b949e" font-size="13">Modern server/discover</text><circle cx="375" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="375" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">isolate</text><text x="375" y="345" text-anchor="middle" fill="#8b949e" font-size="13">healthy_peer_available</text><circle cx="630" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="630" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">recover</text><text x="630" y="345" text-anchor="middle" fill="#8b949e" font-size="13">same_connection_success</text><circle cx="885" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="885" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">cancel ×2</text><text x="885" y="345" text-anchor="middle" fill="#8b949e" font-size="13">2 courtesy notifications</text><circle cx="1140" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="1140" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">restart</text><text x="1140" y="345" text-anchor="middle" fill="#8b949e" font-size="13">same_loop_restart</text><circle cx="1395" cy="285" r="25" fill="#238636" stroke="#7ee787" stroke-width="3"/><text x="1395" y="235" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">drain</text><text x="1395" y="345" text-anchor="middle" fill="#8b949e" font-size="13">owner_and_borrower_propagated</text><rect x="380" y="425" width="840" height="70" rx="16" fill="#12261e" stroke="#238636"/><text x="800" y="468" text-anchor="middle" fill="#7ee787" font-size="21">EOF observed · process reaped · tool registry restored · same loop reusable</text></svg>
