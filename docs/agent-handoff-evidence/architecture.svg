<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">K2DO routed handoff architecture</title>
  <desc id="visual-description">Receipt-derived architecture from inbound message through persisted session and outbound response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#10233f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1400" height="750" rx="24" fill="url(#background)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <text x="54" y="60" class="sans" font-size="30" font-weight="700" fill="#f8fafc">Routed DeepThink handoff — observed routed-processing path</text>
  <text x="54" y="88" class="sans" font-size="16" fill="#94a3b8">Every node and edge is read from the canonical receipt; arrows show execution order.</text>
  <line x1="314" y1="180" x2="376" y2="180" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="654" y1="180" x2="716" y2="180" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="994" y1="180" x2="1056" y2="180" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="1204" y1="250" x2="1204" y2="322" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="1056" y1="410" x2="994" y2="410" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="716" y1="410" x2="654" y2="410" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="376" y1="410" x2="314" y2="410" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><line x1="184" y1="480" x2="184" y2="552" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
  <rect x="54" y="110" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="76" y="144" class="mono" font-size="14" fill="#94a3b8">STEP 01</text>
  <text x="76" y="182" class="sans" font-size="21" font-weight="700" fill="#f8fafc">message_bus</text>
  <text x="76" y="214" class="mono" font-size="16" fill="#7dd3fc">inbound</text>
</g><g filter="url(#shadow)">
  <rect x="394" y="110" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="416" y="144" class="mono" font-size="14" fill="#94a3b8">STEP 02</text>
  <text x="416" y="182" class="sans" font-size="21" font-weight="700" fill="#f8fafc">router</text>
  <text x="416" y="214" class="mono" font-size="16" fill="#7dd3fc">deepthink</text>
</g><g filter="url(#shadow)">
  <rect x="734" y="110" width="260" height="140" rx="18" fill="#0f1d33" stroke="#22d3ee" stroke-width="2"/>
  <text x="756" y="144" class="mono" font-size="14" fill="#94a3b8">STEP 03</text>
  <text x="756" y="182" class="sans" font-size="21" font-weight="700" fill="#f8fafc">thinkers</text>
  <text x="756" y="214" class="mono" font-size="16" fill="#7dd3fc">parallel</text>
</g><g filter="url(#shadow)">
  <rect x="1074" y="110" width="260" height="140" rx="18" fill="#0f1d33" stroke="#22d3ee" stroke-width="2"/>
  <text x="1096" y="144" class="mono" font-size="14" fill="#94a3b8">STEP 04</text>
  <text x="1096" y="182" class="sans" font-size="21" font-weight="700" fill="#f8fafc">judge</text>
  <text x="1096" y="214" class="mono" font-size="16" fill="#7dd3fc">synthesis</text>
</g><g filter="url(#shadow)">
  <rect x="1074" y="340" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="1096" y="374" class="mono" font-size="14" fill="#94a3b8">STEP 05</text>
  <text x="1096" y="412" class="sans" font-size="21" font-weight="700" fill="#f8fafc">agent_loop</text>
  <text x="1096" y="444" class="mono" font-size="16" fill="#7dd3fc">handoff</text>
</g><g filter="url(#shadow)">
  <rect x="734" y="340" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="756" y="374" class="mono" font-size="14" fill="#94a3b8">STEP 06</text>
  <text x="756" y="412" class="sans" font-size="21" font-weight="700" fill="#f8fafc">tool</text>
  <text x="756" y="444" class="mono" font-size="16" fill="#7dd3fc">write_file</text>
</g><g filter="url(#shadow)">
  <rect x="394" y="340" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="416" y="374" class="mono" font-size="14" fill="#94a3b8">STEP 07</text>
  <text x="416" y="412" class="sans" font-size="21" font-weight="700" fill="#f8fafc">tool</text>
  <text x="416" y="444" class="mono" font-size="16" fill="#7dd3fc">read_file</text>
</g><g filter="url(#shadow)">
  <rect x="54" y="340" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="76" y="374" class="mono" font-size="14" fill="#94a3b8">STEP 08</text>
  <text x="76" y="412" class="sans" font-size="21" font-weight="700" fill="#f8fafc">session</text>
  <text x="76" y="444" class="mono" font-size="16" fill="#7dd3fc">persist</text>
</g><g filter="url(#shadow)">
  <rect x="54" y="570" width="260" height="140" rx="18" fill="#0f1d33" stroke="#a78bfa" stroke-width="2"/>
  <text x="76" y="604" class="mono" font-size="14" fill="#94a3b8">STEP 09</text>
  <text x="76" y="642" class="sans" font-size="21" font-weight="700" fill="#f8fafc">message_bus</text>
  <text x="76" y="674" class="mono" font-size="16" fill="#7dd3fc">outbound</text>
</g>
  <text x="394" y="690" class="mono" font-size="16" fill="#86efac">route=deepthink · parallel peak=3 · tools=write_file → read_file · session=persisted</text>
</svg>
