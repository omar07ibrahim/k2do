</g><g filter="url(#shadow)">
  <rect x="474" y="120" width="370" height="180" rx="20" fill="#0f1d33" stroke="#334155"/>
  <text x="500" y="158" class="mono" font-size="14" fill="#94a3b8">CONCURRENCY</text>
  <text x="500" y="212" class="sans" font-size="29" font-weight="700" fill="#7dd3fc">3 active</text>
  <text x="500" y="252" class="sans" font-size="16" fill="#cbd5e1">barrier-observed peak</text>
</g><g filter="url(#shadow)">
  <rect x="894" y="120" width="370" height="180" rx="20" fill="#0f1d33" stroke="#334155"/>
  <text x="920" y="158" class="mono" font-size="14" fill="#94a3b8">JUDGE GATE</text>
  <text x="920" y="212" class="sans" font-size="29" font-weight="700" fill="#7dd3fc">terminal first</text>
  <text x="920" y="252" class="sans" font-size="16" fill="#cbd5e1">all thinkers drained</text>
</g><g filter="url(#shadow)">
  <rect x="54" y="350" width="370" height="180" rx="20" fill="#0f1d33" stroke="#334155"/>
  <text x="80" y="388" class="mono" font-size="14" fill="#94a3b8">TOOL CHAIN</text>
  <text x="80" y="442" class="sans" font-size="29" font-weight="700" fill="#7dd3fc">write → read</text>
