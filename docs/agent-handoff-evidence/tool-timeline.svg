<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="888" viewBox="0 0 1320 888" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">K2DO tool handoff timeline</title>
  <desc id="visual-description">A receipt-derived timeline of routing, parallel reasoning, tool execution, read-back, and persistence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#10233f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1320" height="888" rx="24" fill="url(#background)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <text x="60" y="54" class="sans" font-size="30" font-weight="700" fill="#f8fafc">Execution timeline · reasoning becomes a verified side effect</text>
  <line x1="90" y1="142" x2="90" y2="814" stroke="#334155" stroke-width="5"/>
  <circle cx="90" cy="142" r="18" fill="#a78bfa"/>
<text x="90" y="148" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">1</text>
<rect x="138" y="104" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="132" class="mono" font-size="14" fill="#a78bfa">ROUTE</text>
<text x="166" y="160" class="sans" font-size="20" font-weight="700" fill="#f8fafc">deepthink</text>
<text x="700" y="155" class="sans" font-size="17" fill="#cbd5e1">production classifier at lab threshold 0.6</text><circle cx="90" cy="254" r="18" fill="#22d3ee"/>
<text x="90" y="260" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">2</text>
<rect x="138" y="216" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="244" class="mono" font-size="14" fill="#22d3ee">FAN-OUT</text>
<text x="166" y="272" class="sans" font-size="20" font-weight="700" fill="#f8fafc">3 thinkers</text>
<text x="700" y="267" class="sans" font-size="17" fill="#cbd5e1">strict barrier; peak provider calls = 3</text><circle cx="90" cy="366" r="18" fill="#38bdf8"/>
<text x="90" y="372" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">3</text>
<rect x="138" y="328" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="356" class="mono" font-size="14" fill="#38bdf8">JUDGE</text>
<text x="166" y="384" class="sans" font-size="20" font-weight="700" fill="#f8fafc">pragmatist</text>
<text x="700" y="379" class="sans" font-size="17" fill="#cbd5e1">after all thinkers terminal</text><circle cx="90" cy="478" r="18" fill="#60a5fa"/>
<text x="90" y="484" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">4</text>
<rect x="138" y="440" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="468" class="mono" font-size="14" fill="#60a5fa">HANDOFF</text>
<text x="166" y="496" class="sans" font-size="20" font-weight="700" fill="#f8fafc">3 provider turns</text>
<text x="700" y="491" class="sans" font-size="17" fill="#cbd5e1">full tool catalog validated each turn</text><circle cx="90" cy="590" r="18" fill="#4ade80"/>
<text x="90" y="596" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">5</text>
<rect x="138" y="552" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="580" class="mono" font-size="14" fill="#4ade80">WRITE</text>
<text x="166" y="608" class="sans" font-size="20" font-weight="700" fill="#f8fafc">write_file</text>
<text x="700" y="603" class="sans" font-size="17" fill="#cbd5e1">32 byte bounded artifact</text><circle cx="90" cy="702" r="18" fill="#34d399"/>
<text x="90" y="708" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">6</text>
<rect x="138" y="664" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="692" class="mono" font-size="14" fill="#34d399">READ-BACK</text>
<text x="166" y="720" class="sans" font-size="20" font-weight="700" fill="#f8fafc">read_file</text>
<text x="700" y="715" class="sans" font-size="17" fill="#cbd5e1">exact tool-result payload validated</text><circle cx="90" cy="814" r="18" fill="#fbbf24"/>
<text x="90" y="820" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#020617">7</text>
<rect x="138" y="776" width="1110" height="82" rx="16" fill="#0f1d33" stroke="#334155"/>
<text x="166" y="804" class="mono" font-size="14" fill="#fbbf24">PERSIST</text>
<text x="166" y="832" class="sans" font-size="20" font-weight="700" fill="#f8fafc">deepthink + write_file + read_file</text>
<text x="700" y="827" class="sans" font-size="17" fill="#cbd5e1">fresh SessionManager disk reload</text>
</svg>
