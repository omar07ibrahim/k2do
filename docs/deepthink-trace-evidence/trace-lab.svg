<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">K2DO offline DeepThink trace capture</title>
  <desc id="visual-description">A terminal rendering derived from the canonical credential-free trace receipt. It shows routing, fallback, timeout, judge degradation, cancellation cleanup, the communication-syscall observation, and the receipt digest.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#10233f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#background)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="1104" height="624" rx="18" fill="#020617" stroke="#334155"/>
    <rect x="48" y="48" width="1104" height="54" rx="18" fill="#111c2f"/>
    <rect x="48" y="84" width="1104" height="18" fill="#111c2f"/>
    <circle cx="82" cy="75" r="7" fill="#fb7185"/>
    <circle cx="106" cy="75" r="7" fill="#fbbf24"/>
    <circle cx="130" cy="75" r="7" fill="#4ade80"/>
    <text x="600" y="82" text-anchor="middle" class="sans" font-size="16" fill="#94a3b8">offline trace capture · no credentials · no live provider</text>
    <text x="82" y="132" class="mono" font-size="20" fill="#e2e8f0">$ python -m k2do.labs.deepthink_trace</text>
    <text x="82" y="178" class="mono" font-size="20" fill="#94a3b8">schema                 k2do.deepthink-trace-lab/v1</text>
    <text x="82" y="224" class="mono" font-size="20" fill="#86efac">status                 verified</text>
    <text x="82" y="270" class="mono" font-size="20" fill="#7dd3fc">router complex/simple  deepthink / simple</text>
    <text x="82" y="316" class="mono" font-size="20" fill="#f8fafc">synthesis             peak=3  fallback=primary_error -&gt; fallback_success</text>
    <text x="82" y="362" class="mono" font-size="20" fill="#fbbf24">thinker timeout       pragmatist / categorical_timeout</text>
    <text x="82" y="408" class="mono" font-size="20" fill="#f8fafc">judge degradation     primary_error -&gt; fallback_error / longest_successful_thinker</text>
    <text x="82" y="454" class="mono" font-size="20" fill="#f8fafc">caller cancellation   cancelled=3  judge_calls=0  active_after=0</text>
    <text x="82" y="500" class="mono" font-size="20" fill="#86efac">network observation   0 observed in listed strace set</text>
    <text x="82" y="546" class="mono" font-size="20" fill="#94a3b8">receipt sha256         f66e1db30dd79d77318a20ae86a0aa450a663e8f5cdff351557ca6fd1d0da80d</text>
  </g>
</svg>
