<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">K2DO synthesis call DAG</title>
  <desc id="visual-description">The synthesis scenario call DAG rendered from receipt nodes and edges, including thinker fallback, timeout, judge gating, and synthesis.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#10233f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <text x="56" y="58" class="sans" font-size="30" font-weight="750" fill="#f8fafc">Receipt-derived synthesis call DAG</text>
  <text x="56" y="88" class="sans" font-size="16" fill="#94a3b8">Production router + DeepThinkEngine · strict scripted provider · no quality or latency claim</text>
