<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">K2DO observed orchestration properties</title>
  <desc id="visual-description">Three receipt-derived panels compare concurrency, fallback, timeout, judge degradation, cancellation, and cleanup outcomes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#10233f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="url(#background)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <text x="44" y="58" class="sans" font-size="30" font-weight="750" fill="#f8fafc">Observed orchestration properties</text>
  <text x="44" y="90" class="sans" font-size="16" fill="#94a3b8">Three deterministic offline scenarios · categorical control-flow evidence · timings excluded</text>
  <g transform="translate(44 130)" filter="url(#shadow)">
    <rect width="348" height="438" rx="18" fill="#0b1729" stroke="#334155"/>
    <rect width="348" height="7" rx="4" fill="#38bdf8"/>
    <text x="24" y="52" class="sans" font-size="21" font-weight="700" fill="#f8fafc">Synthesis path</text>
    <text x="24" y="86" class="mono" font-size="12" fill="#64748b">synthesis_with_thinker_fallback_and_timeout</text>
    <text x="24" y="145" class="sans" font-size="14" fill="#94a3b8">observed provider peak</text>
    <text x="24" y="203" class="sans" font-size="54" font-weight="800" fill="#38bdf8">3</text>
    <text x="70" y="201" class="sans" font-size="16" fill="#94a3b8">of configured max 3</text>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#38bdf8"/>
      <text x="24" y="264" class="mono" font-size="11" font-weight="700" fill="#64748b">THINKER FALLBACK</text>
      <text x="24" y="284" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">primary_error</text>
      <text x="24" y="304" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">-&gt; fallback_success</text>
      <text x="24" y="324" class="mono" font-size="11" font-weight="700" fill="#64748b">TIMEOUT</text>
      <text x="24" y="344" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">pragmatist -&gt; categorical_timeout</text>
      <text x="24" y="364" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">provider_cancelled=true</text>
      <text x="24" y="384" class="mono" font-size="11" font-weight="700" fill="#64748b">JUDGE GATE · ACTIVE_AFTER=0</text>
      <text x="24" y="404" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">after_all_thinkers_terminal</text>
  </g>
  <g transform="translate(426 130)" filter="url(#shadow)">
    <rect width="348" height="438" rx="18" fill="#0b1729" stroke="#334155"/>
    <rect width="348" height="7" rx="4" fill="#a78bfa"/>
    <text x="24" y="52" class="sans" font-size="21" font-weight="700" fill="#f8fafc">Judge degradation</text>
    <text x="24" y="86" class="mono" font-size="12" fill="#64748b">judge_failure_uses_longest_successful_thinker</text>
    <text x="24" y="145" class="sans" font-size="14" fill="#94a3b8">observed provider peak</text>
    <text x="24" y="203" class="sans" font-size="54" font-weight="800" fill="#a78bfa">2</text>
    <text x="70" y="201" class="sans" font-size="16" fill="#94a3b8">of configured max 2</text>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#a78bfa"/>
      <text x="24" y="264" class="mono" font-size="11" font-weight="700" fill="#64748b">JUDGE MODEL PATH</text>
      <text x="24" y="284" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">primary_error</text>
      <text x="24" y="304" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">-&gt; fallback_error</text>
      <text x="24" y="324" class="mono" font-size="11" font-weight="700" fill="#64748b">SELECTION</text>
      <text x="24" y="344" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">longest_successful_thinker</text>
      <text x="24" y="364" class="mono" font-size="11" font-weight="700" fill="#64748b">SELECTED</text>
      <text x="24" y="384" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">creative</text>
      <text x="24" y="404" class="mono" font-size="11" font-weight="700" fill="#64748b">ACTIVE_AFTER=0</text>
  </g>
  <g transform="translate(808 130)" filter="url(#shadow)">
    <rect width="348" height="438" rx="18" fill="#0b1729" stroke="#334155"/>
    <rect width="348" height="7" rx="4" fill="#fb7185"/>
    <text x="24" y="52" class="sans" font-size="21" font-weight="700" fill="#f8fafc">Caller cancellation</text>
    <text x="24" y="86" class="mono" font-size="12" fill="#64748b">caller_cancellation_drains_parallel_thinkers</text>
    <text x="24" y="145" class="sans" font-size="14" fill="#94a3b8">observed provider peak</text>
    <text x="24" y="203" class="sans" font-size="54" font-weight="800" fill="#fb7185">3</text>
    <text x="70" y="201" class="sans" font-size="16" fill="#94a3b8">of configured max 3</text>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#1e293b"/>
    <rect x="24" y="220" width="286" height="10" rx="5" fill="#fb7185"/>
      <text x="24" y="264" class="mono" font-size="11" font-weight="700" fill="#64748b">CANCELLATION</text>
      <text x="24" y="284" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">blocked=3</text>
      <text x="24" y="304" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">cancelled=3</text>
      <text x="24" y="324" class="mono" font-size="11" font-weight="700" fill="#64748b">PROPAGATION</text>
      <text x="24" y="344" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">root_to_all_active_thinkers</text>
      <text x="24" y="364" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">judge_calls=0</text>
      <text x="24" y="384" class="mono" font-size="11" font-weight="700" fill="#64748b">ROOT · CLEANUP</text>
      <text x="24" y="404" class="mono" font-size="12" font-weight="400" fill="#cbd5e1">cancelled · active_after=0</text>
  </g>
  <text x="600" y="626" text-anchor="middle" class="sans" font-size="15" fill="#94a3b8">Bars encode observed concurrent provider calls against each configured max; they do not encode speed or throughput.</text>
</svg>
